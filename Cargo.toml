[workspace]
resolver = "2"
members = ["crates/core", "crates/csi_digital", "crates/face_recognation", "crates/face_recognation", "crates/pocketvision", "crates/tarefa5", "crates/yolo", "opengl", "tarefa6", "tarefa7"]

[workspace.dependencies]
opencv = "0.100.1"
opengl = { path = "opengl" }

glam = "0.33.5"
glow = "0.18.0"
glutin = "0.32.3"
glutin-winit = "0.5.0"
raw-window-handle = "0.6.2"
winit = "0.30.13"
ultralytics-inference = { version = "0.0.54", features = ["coreml"] }
ort = { version = "=2.0.0-rc.14", features = ["lax-feature-matching"] }
